# Publishes a test copy of the game to GitHub Pages on every push to main:
# https://lebot09.github.io/AOMemory/
# One-time setup: repo Settings > Pages > Source: "GitHub Actions".
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build for /AOMemory/
        env:
          VITE_BASE: /AOMemory/
        run: |
          cp .env.example .env
          npm run build
          # Pages has no rewrites: serve the app for deep links like /AOMemory/booth.
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
